name: dockhand

# Docker keeps container logs forever by default; cap each container at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# The stack manager. The only stack started by hand: it must never manage itself.
services:
  dockhand:
    image: fnsys/dockhand:v1.0.57
    container_name: dockhand
    logging: *logging
    restart: unless-stopped
    ports:
      # Loopback only; open to LAN/Tailscale once needed (authentication is enabled).
      # 3001 by default: AdGuard's UI uses 3000.
      - "127.0.0.1:${DOCKHAND_PORT:-3001}:3000"
    volumes:
      # Full Docker control: root-equivalent on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:?Set DATA_ROOT in hosts/<host>.env}/dockhand:/app/data
    environment:
      TZ: ${TZ:-Etc/UTC}
    networks:
      - default
      - proxy # dockhand.home through Nginx Proxy Manager

networks:
  # Shared network, created once per host: `docker network create proxy`.
  proxy:
    name: proxy
    external: true
