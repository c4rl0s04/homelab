name: trek

services:
  trek:
    image: mauriceboe/trek:5.1.3
    container_name: trek
    restart: unless-stopped
    # Hardening from the upstream compose file.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL # lets dumb-init forward SIGTERM for a graceful shutdown
    ports:
      # Loopback only; other devices use trek.home through Nginx Proxy Manager.
      - "127.0.0.1:${TREK_PORT:-3002}:3000"
    networks:
      - default
      - proxy
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/trek/data:/app/data
      - ${DATA_ROOT:?Set DATA_ROOT}/trek/uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-Etc/UTC}
      ENCRYPTION_KEY: ${TREK_ENCRYPTION_KEY:?Set TREK_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${TREK_ALLOWED_ORIGINS:-http://trek.casa.home,http://127.0.0.1:3002}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Shared network from infra: Nginx Proxy Manager serves trek.home through it.
  proxy:
    name: proxy
    external: true
