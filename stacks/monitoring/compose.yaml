name: monitoring

services:
  # Checks that every web service answers and sends alerts when one goes down.
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11
    container_name: uptime-kuma
    restart: unless-stopped
    # Time to close its SQLite database cleanly on stop or redeploy.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3003}:3001"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/uptime-kuma:/app/data
    environment:
      TZ: ${TZ:-Etc/UTC}
    networks:
      - proxy # status.home, and checks other services by container name

networks:
  proxy:
    name: proxy
    external: true
