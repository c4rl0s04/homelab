name: infra

services:
  # Home DNS: ad blocking and *.home names for every device on the network.
  adguardhome:
    # Same image digest as the previous media stack, so the moved config loads unchanged.
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${ADGUARD_UI_PORT:-3000}:3000/tcp"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/adguardhome/work:/opt/adguardhome/work
      - ${DATA_ROOT:?Set DATA_ROOT}/adguardhome/conf:/opt/adguardhome/conf

  # Reverse proxy: single entry point (80/443) that forwards *.home to each stack's web service.
  npm:
    image: jc21/nginx-proxy-manager@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/npm:/data
      - ${DATA_ROOT:?Set DATA_ROOT}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy
      - legacy-media

  # Backups: web UI for restic (encrypted, deduplicated snapshots).
  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    # Fixed name: restic records it as the snapshot host.
    hostname: backrest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKREST_PORT:-9898}:9898"
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/backrest/data:/data
      - ${DATA_ROOT:?Set DATA_ROOT}/backrest/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT}/backrest/cache:/cache
      # Sources are read-only: backups can never modify live data.
      - ${DATA_ROOT:?Set DATA_ROOT}:/userdata/homelab-data:ro
      # shortcut: old media stack folder (configs, .env), until media lives in stacks/media.
      # The backup plan excludes its data/ (films, downloads).
      - ${LEGACY_MEDIA_ROOT:?Set LEGACY_MEDIA_ROOT}:/userdata/legacy-media:ro
      # Repository on a different physical disk than DATA_ROOT.
      - ${BACKUP_ROOT:?Set BACKUP_ROOT}:/repos

networks:
  # Shared network: each stack attaches only its web service so npm can reach it by container name.
  proxy:
    name: proxy
  # shortcut: reaches the old media stack (still run from <old-project>) by container name;
  # remove once media lives in stacks/media and joins `proxy`.
  legacy-media:
    name: streaming_default
    external: true
