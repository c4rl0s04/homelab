name: infra

# Docker keeps container logs forever by default; cap each container at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Home DNS: ad blocking and *.home names for every device on the network.
  adguardhome:
    # Same image digest as the previous media stack, so the moved config loads unchanged.
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    logging: *logging
    restart: unless-stopped
    ports:
      # On Windows, Internet Connection Sharing (needed by Docker/WSL networking) holds 0.0.0.0:53/udp.
      # Binding the LAN address explicitly wins over that wildcard. Set DNS_BIND_IP to the host's reserved LAN IP.
      - "${DNS_BIND_IP:-0.0.0.0}:53:53/tcp"
      - "${DNS_BIND_IP:-0.0.0.0}:53:53/udp"
      # Loopback only: from other devices, use adguard.casa.home (behind Tinyauth).
      - "127.0.0.1:${ADGUARD_UI_PORT:-3000}:3000/tcp"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/adguardhome/work:/opt/adguardhome/work
      - ${DATA_ROOT:?Set DATA_ROOT}/adguardhome/conf:/opt/adguardhome/conf
    networks:
      - default
      - proxy # adguard.home

  # Reverse proxy: single entry point (80/443) that forwards *.home to each stack's web service.
  npm:
    image: jc21/nginx-proxy-manager@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    container_name: npm
    logging: *logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/npm:/data
      - ${DATA_ROOT:?Set DATA_ROOT}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  # Backups: web UI for restic (encrypted, deduplicated snapshots).
  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    logging: *logging
    # Fixed name: restic records it as the snapshot host.
    hostname: backrest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKREST_PORT:-9898}:9898"
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/backrest/data:/data
      - ${DATA_ROOT:?Set DATA_ROOT}/backrest/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT}/backrest/cache:/cache
      # Sources are read-only: backups can never modify live data.
      - ${DATA_ROOT:?Set DATA_ROOT}:/userdata/homelab-data:ro
      # Repository on a different physical disk than DATA_ROOT.
      - ${BACKUP_ROOT:?Set BACKUP_ROOT}:/repos
    networks:
      - default
      - proxy # backrest.home

  # Single login for the web UIs: npm asks it before serving a protected *.casa.home name.
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    container_name: tinyauth
    logging: *logging
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      # The session cookie is set for the parent domain (casa.home), so one login covers every *.casa.home name.
      # A bare `.home` name does not work: the cookie would be limited to auth.home itself.
      TINYAUTH_APPURL: http://auth.casa.home
      TINYAUTH_AUTH_USERSFILE: /data/users.txt
      TINYAUTH_AUTH_SESSIONEXPIRY: ${TINYAUTH_SESSION_SECONDS:-604800}
    volumes:
      # users.txt: one `user:bcrypt-hash` per line, created with `tinyauth user create --interactive`.
      - ${DATA_ROOT:?Set DATA_ROOT}/tinyauth:/data
    networks:
      - proxy # auth.casa.home, and npm's auth checks (http://tinyauth:3000/api/auth/nginx)

networks:
  # Shared network: every web service joins it so npm can reach it by container name.
  # Created once per host (`docker network create proxy`) because Dockhand, started first, also joins it.
  proxy:
    name: proxy
    external: true
