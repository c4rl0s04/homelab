name: portal

# Docker keeps container logs forever by default; cap each container at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Homepage: one page with every app, its status and live widgets.
# Its configuration lives in this file (Compose `configs` with inline content) so it is versioned in Git
# and needs no host path: Dockhand runs Compose from its own checkout, where `./config` would not resolve on the host.
# Widget keys come from Dockhand stack variables; Homepage reads them as {{HOMEPAGE_VAR_*}}.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3004}:3000"
    environment:
      TZ: ${TZ:-Etc/UTC}
      HOMEPAGE_ALLOWED_HOSTS: portal.casa.home,127.0.0.1:${PORTAL_PORT:-3004}
      # Optional until set in Dockhand; a widget without its key shows an error, the link still works.
      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY:-}
      HOMEPAGE_VAR_JELLYSEERR_KEY: ${JELLYSEERR_API_KEY:-}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY:-}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY:-}
      HOMEPAGE_VAR_BAZARR_KEY: ${BAZARR_API_KEY:-}
    configs:
      - { source: settings, target: /app/config/settings.yaml }
      - { source: services, target: /app/config/services.yaml }
      - { source: widgets, target: /app/config/widgets.yaml }
      - { source: bookmarks, target: /app/config/bookmarks.yaml }
      - { source: docker, target: /app/config/docker.yaml }
      - { source: custom-css, target: /app/config/custom.css }
      - { source: custom-js, target: /app/config/custom.js }
    networks:
      - proxy # portal.home, and status checks by container name

networks:
  proxy:
    name: proxy
    external: true

configs:
  settings:
    content: |
      title: Casa
      description: Todas las apps del homelab en una página
      language: es
      theme: dark
      color: slate
      headerStyle: clean
      statusStyle: dot
      hideVersion: true
      useEqualHeights: true
      disableCollapse: true
      quicklaunch:
        searchDescriptions: true
        hideInternetSearch: true
        hideVisitURL: true
      layout:
        Ver:
          style: row
          columns: 2
          icon: mdi-play-circle-outline
        Biblioteca:
          style: row
          columns: 2
          icon: mdi-bookshelf
        Herramientas:
          style: row
          columns: 3
          icon: mdi-toolbox-outline
        Sistema:
          style: row
          columns: 5
          icon: mdi-server-outline

  services:
    content: |
      - Ver:
          - Jellyfin:
              icon: jellyfin.png
              href: http://jellyfin.casa.home
              description: Ver películas
              siteMonitor: http://jellyfin:8096/health
              widget:
                type: jellyfin
                version: 2 # Jellyfin 12 (10.12) or newer needs widget version 2
                url: http://jellyfin:8096
                key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
                enableBlocks: true
                enableNowPlaying: true
          - Jellyseerr:
              icon: jellyseerr.png
              href: http://jellyseer.casa.home
              description: Pedir películas
              siteMonitor: http://jellyseerr:5055
              widget:
                type: jellyseerr
                url: http://jellyseerr:5055
                key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"
      - Biblioteca:
          - Radarr:
              icon: radarr.png
              href: http://radarr.casa.home
              description: Busca y ordena películas
              siteMonitor: http://radarr:7878/ping
              widget:
                type: radarr
                url: http://radarr:7878
                key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          - Prowlarr:
              icon: prowlarr.png
              href: http://prowlarr.casa.home
              description: Indexadores
              siteMonitor: http://prowlarr:9696/ping
              widget:
                type: prowlarr
                url: http://prowlarr:9696
                key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
          - Bazarr:
              icon: bazarr.png
              href: http://bazarr.casa.home
              description: Subtítulos
              siteMonitor: http://bazarr:6767
              widget:
                type: bazarr
                url: http://bazarr:6767
                key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
          - qBittorrent:
              icon: qbittorrent.png
              href: http://qbit.casa.home
              description: Descargas por VPN
              siteMonitor: http://gluetun:8080
      - Herramientas:
          - TREK:
              icon: mdi-map-marker-path
              href: http://trek.casa.home
              description: Planificar viajes
              siteMonitor: http://trek:3000/api/health
          - PairDrop:
              icon: pairdrop.png
              href: http://drop.casa.home
              description: Pasar archivos entre dispositivos
              siteMonitor: http://pairdrop:3000
          - Stirling-PDF:
              icon: stirling-pdf.png
              href: http://pdf.casa.home
              description: Herramientas PDF
              siteMonitor: http://stirling-pdf:8080
      - Sistema:
          - Dockhand:
              icon: mdi-docker
              href: http://dockhand.casa.home
              description: Stacks y despliegues
              siteMonitor: http://dockhand:3000
          - Uptime Kuma:
              icon: uptime-kuma.png
              href: http://status.casa.home
              description: Estado y avisos
              siteMonitor: http://uptime-kuma:3001
          - AdGuard:
              icon: adguard-home.png
              href: http://adguard.casa.home
              description: DNS y anuncios
              siteMonitor: http://adguardhome:3000
          - Nginx Proxy Manager:
              icon: nginx-proxy-manager.png
              href: http://npm.casa.home
              description: Nombres .casa.home
              siteMonitor: http://npm:81
          - Backrest:
              icon: backrest.png
              href: http://backrest.casa.home
              description: Copias de seguridad
              siteMonitor: http://backrest:9898

  widgets:
    content: |
      - resources:
          cpu: true
          memory: true
          uptime: true
      - datetime:
          text_size: xl
          locale: es
          format:
            dateStyle: full
            timeStyle: short


  bookmarks:
    content: |
      # Empty: the repository link sits in the footer (custom.js).
      []

  docker:
    content: |
      # Empty on purpose: no Docker socket, Homepage gets status from siteMonitor checks.

  # Liquid glass look. Selectors match Homepage v2.7.0; re-check the page after a version bump.
  custom-css:
    content: |
      /* Liquid glass over a dark room with coloured light. Selectors match Homepage v2.7.0. */
      :root {
        --bg: #07080e;
        --glass: rgba(255, 255, 255, 0.06);
        --glass-hover: rgba(255, 255, 255, 0.09);
        --glass-thick: rgba(18, 20, 30, 0.72);
        --stroke: rgba(255, 255, 255, 0.10);
        --edge: rgba(255, 255, 255, 0.20);
        --fill: rgba(255, 255, 255, 0.045);
        --text: #f3f4fa;
        --text-2: rgba(226, 230, 255, 0.74);
        --text-3: rgba(226, 230, 255, 0.58);
        --accent: #9aa8ff;
        --ok: #34d399;
        --bad: #fb7185;
        --r-card: 16px;
        --r-sheet: 24px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --material: blur(24px) saturate(170%);
        --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
        --shadow-thick: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }

      html, body {
        background: var(--bg) !important;
      }
      body {
        background:
          radial-gradient(70vmax 55vmax at 8% -6%, rgba(84, 98, 255, 0.34), transparent 62%),
          radial-gradient(60vmax 50vmax at 96% 12%, rgba(176, 84, 255, 0.24), transparent 60%),
          radial-gradient(70vmax 50vmax at 60% 112%, rgba(20, 184, 166, 0.18), transparent 62%),
          var(--bg) !important;
        background-attachment: fixed !important;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #__next { background: transparent !important; }
      ::selection { background: rgba(154, 168, 255, 0.35); color: #fff; }
      * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.18) transparent; }
      :focus-visible { outline: 2px solid var(--accent) !important; outline-offset: 3px; border-radius: 10px; }

      #inner_wrapper > * { max-width: 1360px; margin-left: auto; margin-right: auto; }

      /* Header: one glass bar with resources and the date */
      #information-widgets {
        background: var(--glass) !important;
        backdrop-filter: var(--material);
        -webkit-backdrop-filter: var(--material);
        border-radius: var(--r-card) !important;
        box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--stroke), var(--shadow) !important;
        padding: 14px 20px !important;
      }
      #information-widgets .resource-usage { background: rgba(255, 255, 255, 0.10) !important; }
      #information-widgets .resource-usage > div { background: linear-gradient(90deg, #7c8cff, #c084fc) !important; }
      #information-widgets, #information-widgets * { color: var(--text-2); font-variant-numeric: tabular-nums; }
      .information-widget-datetime { color: var(--text) !important; font-weight: 600; letter-spacing: -0.01em; }

      /* Sections */
      .services-group { margin-top: 28px; }
      .services-group > button { cursor: default; }
      .service-group-name {
        color: var(--text) !important;
        font-size: 1.5rem !important;
        font-weight: 650 !important;
        letter-spacing: -0.025em;
        line-height: 1.1;
        align-items: center;
        gap: 10px;
      }
      .service-group-name svg, .service-group-name img { opacity: 0.8; }
      .services-list { gap: 14px !important; margin-top: 14px !important; }

      /* Cards: the glass material */
      .service { position: relative; }
      .service-card {
        background: var(--glass) !important;
        backdrop-filter: var(--material);
        -webkit-backdrop-filter: var(--material);
        border-radius: var(--r-card) !important;
        box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--stroke), var(--shadow) !important;
        color: var(--text) !important;
        padding: 8px !important;
        margin-bottom: 0 !important;
        height: 100%;
        transition: transform 220ms var(--ease), background-color 220ms var(--ease) !important;
      }
      .service-card:hover { background: var(--glass-hover) !important; transform: translateY(-2px); }
      .service-card:active { transform: scale(0.985); transition-duration: 90ms !important; }

      .service-icon img { width: 34px; height: 34px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35)); }
      .service-icon svg { width: 30px; height: 30px; color: var(--text); }
      .service-name { font-size: 0.95rem !important; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
      .service-description { color: var(--text-3) !important; font-size: 0.8rem !important; font-weight: 450 !important; margin-top: 2px; }

      /* Widget numbers: tinted wells inside the glass, not another glass layer */
      .service-container { gap: 6px; padding: 4px 4px 2px; flex-wrap: wrap; }
      .service-block {
        background: var(--fill) !important;
        border-radius: 10px !important;
        margin: 0 !important;
        padding: 8px 4px !important;
        min-width: 74px;
      }
      .service-block-value { font-size: 1.05rem !important; font-weight: 600 !important; color: var(--text); font-variant-numeric: tabular-nums; }
      .service-block-label { font-size: 0.62rem !important; font-weight: 600 !important; letter-spacing: 0.06em; color: var(--text-3); }

      /* Status: a lit dot */
      .site-monitor-status { padding: 14px !important; background: none !important; }
      .site-monitor-status > div { height: 8px !important; width: 8px !important; }
      .site-monitor-status .bg-emerald-500 { background: var(--ok) !important; box-shadow: 0 0 10px 1px rgba(52, 211, 153, 0.55); }
      .site-monitor-status [class*="bg-rose"], .site-monitor-status [class*="bg-red"] { background: var(--bad) !important; box-shadow: 0 0 10px 1px rgba(251, 113, 133, 0.6); }

      /* Info button (added by custom.js) */
      .hl-info {
        display: grid; place-items: center;
        width: 28px; height: 28px; margin: 4px 0 0;
        border-radius: 999px; border: 0; cursor: pointer;
        color: var(--text-3); background: transparent;
        transition: color 160ms var(--ease), background-color 160ms var(--ease), transform 160ms var(--ease);
      }
      .hl-info:hover { color: var(--text); background: rgba(255, 255, 255, 0.10); }
      .hl-info:active { transform: scale(0.92); }
      .hl-info svg { width: 16px; height: 16px; }

      /* Info sheet */
      .hl-scrim {
        position: fixed; inset: 0; z-index: 60;
        background: rgba(4, 5, 10, 0.45);
        opacity: 0; transition: opacity 260ms var(--ease);
      }
      .hl-sheet {
        position: fixed; z-index: 61; top: 16px; right: 16px; bottom: 16px;
        width: min(420px, calc(100vw - 32px));
        overflow: auto; overscroll-behavior: contain;
        padding: 24px;
        color: var(--text);
        background: var(--glass-thick);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border-radius: var(--r-sheet);
        box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--stroke), var(--shadow-thick);
        transform: translateX(28px) scale(0.98); opacity: 0; filter: blur(6px);
        transform-origin: right center;
        transition: transform 420ms var(--ease), opacity 300ms var(--ease), filter 300ms var(--ease);
      }
      .hl-open .hl-scrim { opacity: 1; }
      .hl-open .hl-sheet { transform: none; opacity: 1; filter: none; }

      .hl-head { display: flex; align-items: center; gap: 14px; }
      .hl-head img { width: 44px; height: 44px; }
      .hl-title { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; margin: 0; }
      .hl-state { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.8rem; color: var(--text-2); }
      .hl-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
      .hl-state[data-state="ok"]::before { background: var(--ok); box-shadow: 0 0 10px 1px rgba(52, 211, 153, 0.55); }
      .hl-state[data-state="bad"]::before { background: var(--bad); box-shadow: 0 0 10px 1px rgba(251, 113, 133, 0.6); }
      .hl-close {
        margin-left: auto; align-self: flex-start;
        display: grid; place-items: center; width: 34px; height: 34px;
        border: 0; border-radius: 999px; cursor: pointer;
        color: var(--text-2); background: rgba(255, 255, 255, 0.08);
      }
      .hl-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.14); }
      .hl-close svg { width: 16px; height: 16px; }
      .hl-what { margin: 22px 0 0; font-size: 1rem; line-height: 1.55; color: var(--text); max-width: 60ch; }
      .hl-facts { margin: 22px 0 0; display: grid; gap: 2px; border-radius: 14px; overflow: hidden; }
      .hl-facts div { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 11px 14px; background: var(--fill); }
      .hl-facts dt { color: var(--text-3); font-size: 0.82rem; }
      .hl-facts dd { margin: 0; font-size: 0.86rem; color: var(--text); overflow-wrap: anywhere; }
      .hl-facts code { font: 500 0.82rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-2); }
      .hl-tip { margin: 18px 0 0; font-size: 0.88rem; line-height: 1.5; color: var(--text-2); }
      .hl-go {
        display: flex; justify-content: center; align-items: center; gap: 8px;
        margin-top: 24px; padding: 12px 16px; border-radius: 14px;
        font-weight: 600; color: #0b0d18; background: #e9ecff;
        text-decoration: none; transition: transform 140ms var(--ease), background-color 140ms var(--ease);
      }
      .hl-go:hover { background: #ffffff; }
      .hl-go:active { transform: scale(0.98); }
      .hl-go svg { width: 16px; height: 16px; }

      /* Footer link (added by custom.js) */
      .hl-repo { color: var(--text-3); font-size: 0.8rem; text-decoration: none; margin-right: auto; align-self: center; }
      .hl-repo:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

      /* Phones: one column, the sheet rises from the bottom */
      @media (max-width: 640px) {
        .service-group-name { font-size: 1.3rem !important; }
        .information-widget-datetime { font-size: 1.05rem !important; }
        .hl-facts div { grid-template-columns: 1fr; gap: 2px; }
        .hl-sheet {
          top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 82vh;
          transform: translateY(40px); transform-origin: bottom center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .service-card, .hl-sheet, .hl-scrim, .hl-info, .hl-go { transition: opacity 160ms linear !important; }
        .service-card:hover, .service-card:active { transform: none; }
        .hl-sheet { transform: none !important; filter: none !important; }
      }
      @media (prefers-reduced-transparency: reduce) {
        .service-card, #information-widgets { background: #161925 !important; backdrop-filter: none; -webkit-backdrop-filter: none; }
        .hl-sheet { background: #12141e; backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
      @media (prefers-contrast: more) {
        :root { --stroke: rgba(255, 255, 255, 0.45); --text-3: rgba(240, 242, 255, 0.85); }
      }

  # Info sheet: the (i) on each card. A new service needs an entry in INFO to get one.
  # `$$` is Compose's escape for `$`; the container receives single `$`.
  custom-js:
    content: |
      // Info sheet for each app. Keyed by the service name in services.yaml; apps not listed get no info button.
      (() => {
        const TINY = "Login común (Tinyauth)";
        const INFO = {
          "Jellyfin": { what: "Tu cine en casa: reproduce las películas en la tele, el móvil o el navegador.", stack: "media", login: "Cuenta propia de Jellyfin", addr: "jellyfin:8096", tip: "Las apps de TV y móvil no pueden usar el login común, por eso Jellyfin mantiene el suyo." },
          "Jellyseerr": { what: "Pide una película y Radarr la busca y la descarga sola.", stack: "media", login: "Tu cuenta de Jellyfin", addr: "jellyseerr:5055" },
          "Radarr": { what: "Busca, descarga y ordena las películas en la biblioteca.", stack: "media", login: TINY, addr: "radarr:7878", tip: "Busca con Prowlarr, descarga con qBittorrent y deja la película lista para Jellyfin." },
          "Prowlarr": { what: "Gestiona los indexadores, las webs donde se buscan los torrents, y se los pasa a Radarr.", stack: "media", login: TINY, addr: "prowlarr:9696", tip: "Byparr le ayuda a pasar las comprobaciones de Cloudflare." },
          "Bazarr": { what: "Descarga subtítulos para las películas de la biblioteca.", stack: "media", login: TINY, addr: "bazarr:6767" },
          "qBittorrent": { what: "Descarga los torrents que le manda Radarr.", stack: "media", login: TINY, addr: "gluetun:8080", tip: "Sale a internet solo por la VPN de ProtonVPN. Si la VPN cae, se queda sin conexión en vez de usar la de casa." },
          "TREK": { what: "Planifica viajes: días, sitios, reservas, presupuesto y maleta.", stack: "trek", login: "Cuentas propias de TREK", addr: "trek:3000", tip: "Claude también puede organizar viajes aquí a través de su conexión MCP." },
          "PairDrop": { what: "Pasa archivos entre dispositivos de casa, como AirDrop.", stack: "tools", login: "Sin login: cualquiera en el Wi-Fi de casa", addr: "pairdrop:3000", tip: "Ábrelo en los dos dispositivos; los archivos van directos de uno a otro." },
          "Stirling-PDF": { what: "Une, divide, comprime, firma y pasa OCR a PDFs sin subirlos a ninguna web.", stack: "tools", login: TINY, addr: "stirling-pdf:8080", tip: "El OCR reconoce texto en español." },
          "Dockhand": { what: "Despliega y controla todos los stacks desde las recetas de Git.", stack: "dockhand", login: "Login común y después el suyo propio", addr: "dockhand:3000", tip: "Controla todo el homelab, por eso tiene dos cerrojos." },
          "Uptime Kuma": { what: "Comprueba cada minuto que cada servicio responde.", stack: "monitoring", login: TINY, addr: "uptime-kuma:3001" },
          "AdGuard": { what: "El DNS de casa: bloquea anuncios y resuelve los nombres .casa.home.", stack: "infra", login: TINY, addr: "adguardhome:3000" },
          "Nginx Proxy Manager": { what: "Lleva cada nombre .casa.home a su app y pide el login común donde toca.", stack: "infra", login: "Login propio (no depende del común)", addr: "npm:81" },
          "Backrest": { what: "Copias de seguridad de los datos del homelab.", stack: "infra", login: TINY, addr: "backrest:9898", tip: "Copia cada 24 horas a otro disco." },
        };
        const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">$${d}</svg>`;
        const ICON_INFO = svg('<circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5M12 8h.01"/>');
        const ICON_CLOSE = svg('<path d="M6 6l12 12M18 6L6 18"/>');
        const ICON_OPEN = svg('<path d="M7 17L17 7M9 7h8v8"/>');
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

        const root = document.createElement("div");
        root.innerHTML = `<div class="hl-scrim" hidden></div>
          <aside class="hl-sheet" role="dialog" aria-modal="true" aria-labelledby="hl-title" hidden tabindex="-1"></aside>`;
        document.body.append(root);
        const scrim = root.querySelector(".hl-scrim");
        const sheet = root.querySelector(".hl-sheet");
        let opener = null;

        function stateOf(li) {
          const t = li.querySelector(".site-monitor-status")?.getAttribute("title") || "";
          if (!t) return { key: "", text: "Comprobando…" };
          return /\b[23]\d\d\b/.test(t) ? { key: "ok", text: "Funciona" } : { key: "bad", text: "No responde" };
        }

        function open(li, button) {
          const name = li.dataset.name;
          const info = INFO[name];
          const href = li.querySelector("a[href]")?.href || "#";
          const icon = li.querySelector(".service-icon img")?.src;
          const st = stateOf(li);
          sheet.innerHTML = `
            <div class="hl-head">
              $${icon ? `<img src="$${esc(icon)}" alt="">` : ""}
              <div><h2 class="hl-title" id="hl-title">$${esc(name)}</h2>
              <div class="hl-state" data-state="$${st.key}">$${st.text}</div></div>
              <button type="button" class="hl-close" aria-label="Cerrar">$${ICON_CLOSE}</button>
            </div>
            <p class="hl-what">$${esc(info.what)}</p>
            <dl class="hl-facts">
              <div><dt>Acceso</dt><dd>$${esc(info.login)}</dd></div>
              <div><dt>Stack</dt><dd>$${esc(info.stack)}</dd></div>
              <div><dt>Dirección interna</dt><dd><code>$${esc(info.addr)}</code></dd></div>
              <div><dt>Dirección</dt><dd><code>$${esc(new URL(href, location.href).host)}</code></dd></div>
            </dl>
            $${info.tip ? `<p class="hl-tip">$${esc(info.tip)}</p>` : ""}
            <a class="hl-go" href="$${esc(href)}" target="_blank" rel="noreferrer">Abrir $${esc(name)} $${ICON_OPEN}</a>`;
          sheet.querySelector(".hl-close").addEventListener("click", close);
          opener = button;
          scrim.hidden = sheet.hidden = false;
          requestAnimationFrame(() => root.classList.add("hl-open"));
          sheet.focus();
        }

        function close() {
          if (sheet.hidden) return;
          root.classList.remove("hl-open");
          const done = () => { if (!root.classList.contains("hl-open")) scrim.hidden = sheet.hidden = true; };
          sheet.addEventListener("transitionend", done, { once: true });
          setTimeout(done, 450); // reduced motion or no transition
          opener?.focus();
        }

        scrim.addEventListener("click", close);
        document.addEventListener("keydown", (e) => {
          if (sheet.hidden) return;
          if (e.key === "Escape") close();
          if (e.key === "Tab") { // keep focus inside the sheet while it is open
            const f = [...sheet.querySelectorAll("button, a[href]")];
            if (!f.length) return;
            const [first, last] = [f[0], f[f.length - 1]];
            if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        });

        function decorate() {
          document.querySelectorAll("li.service[data-name]").forEach((li) => {
            if (!INFO[li.dataset.name] || li.querySelector(".hl-info")) return;
            const b = document.createElement("button");
            b.type = "button";
            b.className = "hl-info";
            b.setAttribute("aria-label", `Información sobre $${li.dataset.name}`);
            b.innerHTML = ICON_INFO;
            b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); open(li, b); });
            (li.querySelector(".service-tags") || li.querySelector(".service-card"))?.prepend(b);
          });
          const style = document.querySelector("#footer #style");
          if (style && !style.querySelector(".hl-repo")) {
            style.insertAdjacentHTML("afterbegin", '<a class="hl-repo" href="https://github.com/c4rl0s04/homelab" target="_blank" rel="noreferrer">Recetas del homelab en GitHub</a>');
          }
        }

        new MutationObserver(decorate).observe(document.body, { childList: true, subtree: true });
        decorate();
      })();
