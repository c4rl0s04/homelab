name: tools

# Docker keeps container logs forever by default; cap each container at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Send files between devices on the home network, like AirDrop. Transfers go device to device (WebRTC).
  pairdrop:
    image: ghcr.io/schlagmichdoch/pairdrop:v1.11.2
    container_name: pairdrop
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAIRDROP_PORT:-3005}:3000"
    environment:
      TZ: ${TZ:-Etc/UTC}
    networks:
      - proxy # drop.casa.home; npm sets X-Forwarded-For, which PairDrop uses to group devices of one network

  # PDF toolbox: merge, split, compress, OCR, sign. Files are processed here, never sent to a website.
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.3.0
    container_name: stirling-pdf
    logging: *logging
    restart: unless-stopped
    mem_limit: 4g # the size its docs recommend; keeps a large OCR job from starving other stacks
    ports:
      - "127.0.0.1:${STIRLING_PDF_PORT:-3006}:8080"
    environment:
      TZ: ${TZ:-Etc/UTC}
      SECURITY_ENABLELOGIN: "false" # behind Tinyauth like the other tools
      SYSTEM_DEFAULTLOCALE: es-ES
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/stirling-pdf/configs:/configs
      - ${DATA_ROOT:?Set DATA_ROOT}/stirling-pdf/storage:/storage
      # OCR languages. The image ships eng, deu, fra, por, chi_sim; this folder holds those plus spa
      # (tessdata_fast). It replaces the image's folder, so it must contain every language, not only extras.
      - ${DATA_ROOT:?Set DATA_ROOT}/stirling-pdf/tessdata:/usr/share/tesseract-ocr/5/tessdata
    networks:
      - proxy # pdf.casa.home

  # A Firefox that lives in a container, streamed to any device over WebRTC; several people can share it.
  # Nothing is kept: a redeploy starts a clean browser.
  neko:
    image: ghcr.io/m1k1o/neko/firefox:3.2.0
    container_name: neko
    logging: *logging
    restart: unless-stopped
    shm_size: 2gb
    mem_limit: 3g
    ports:
      - "127.0.0.1:${NEKO_PORT:-3008}:8080"
      # Video and input travel over these UDP ports, straight from the LAN (HOST_IP: this machine's LAN address).
      - "${HOST_IP:?Set HOST_IP}:52000-52100:52000-52100/udp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      NEKO_DESKTOP_SCREEN: 1280x720@30 # the size Firefox opens at, so it fills the screen; less CPU than 1080p
      # No own login: everyone who passes Tinyauth is admin, which is only the owner today.
      NEKO_MEMBER_PROVIDER: noauth
      NEKO_SESSION_COOKIE_SECURE: "false" # plain HTTP on the LAN
      NEKO_WEBRTC_EPR: 52000-52100
      NEKO_WEBRTC_ICELITE: "1"
      NEKO_WEBRTC_NAT1TO1: ${HOST_IP:?Set HOST_IP}
    networks:
      - proxy # browser.casa.home

networks:
  proxy:
    name: proxy
    external: true
